name: Feature request
description: Propose a user or research capability
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and users
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data, privacy, licensing, or security impact
